<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نتيجة الدفع — مدارك للتدريب والتعليم</title>
  <meta name="description" content="نتيجة عملية الدفع على منصة مدارك للتدريب والتعليم.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%99%3C/text%3E%3C/svg%3E">
  <style>
    .result-wrap { min-height: 55vh; display: flex; align-items: center; justify-content: center; padding: 48px 20px 80px; }
    .result-card { max-width: 460px; width: 100%; text-align: center; }
    .result-ico { width: 84px; height: 84px; margin: 0 auto 22px; border-radius: 50%; display: grid; place-items: center; }
    .result-ico.ok { background: var(--success-soft); color: var(--success); }
    .result-ico.bad { background: var(--error-soft, rgba(239,68,68,.12)); color: #ef4444; }
    .result-ico svg { width: 40px; height: 40px; }
    .result-card h2 { font-size: 24px; margin-bottom: 10px; }
    .result-card p { color: var(--text-muted); font-size: 15px; line-height: 1.8; margin-bottom: 26px; }
    .result-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>

  <div data-slot="header" data-active=""></div>

  <main class="result-wrap">
    <div class="result-card panel" id="resultCard">
      <div class="result-ico" id="resultIco">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <h2 id="resultTitle">جاري التحقق من الدفع...</h2>
      <p id="resultText">نرجو الانتظار، نتحقق من حالة عملية الدفع.</p>
      <div class="result-actions" id="resultActions">
        <a href="index.html" class="btn btn-primary btn-lg">العودة للرئيسية</a>
      </div>
    </div>
  </main>

  <div data-slot="footer"></div>

  <script src="js/site-config.js"></script>
  <script src="js/components.js"></script>
  <script src="js/payment.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      "use strict";
      function qs(name) {
        return new URLSearchParams(location.search).get(name);
      }
      function toast(msg, type) {
        if (window.toast) { window.toast(msg, type); return; }
      }

      var chargeId = qs("charge_id") || qs("id");
      var ico = document.getElementById("resultIco");
      var title = document.getElementById("resultTitle");
      var text = document.getElementById("resultText");
      var actions = document.getElementById("resultActions");

      function success(p) {
        ico.className = "result-ico ok";
        title.textContent = "تم الدفع بنجاح 🎉";
        text.textContent = "تم تأكيد عملية الدفع. الآن يمكنك الوصول إلى " + p + ". شكراً لثقتك بمنصة مدارك!";
        actions.innerHTML = '' +
          '<a href="index.html" class="btn btn-primary btn-lg">العودة للرئيسية</a>' +
          '<a href="dashboard.html" class="btn btn-outline btn-lg">لوحة التحكم</a>';
      }
      function failure(msg) {
        ico.className = "result-ico bad";
        title.textContent = "تعذر إتمام الدفع";
        text.textContent = msg + " إذا كان المبلغ قد خُصم، فسيعود تلقائياً لحسابك خلال أيام قليلة.";
        actions.innerHTML = '' +
          '<a href="index.html" class="btn btn-primary btn-lg">العودة للرئيسية</a>' +
          '<a href="courses.html" class="btn btn-outline btn-lg">تصفح الكورسات</a>';
      }

      if (!chargeId) {
        failure("لم يتم العثور على تفاصيل عملية الدفع في الرابط.");
        return;
      }

      fetch("/.netlify/functions/charge-status?charge_id=" + encodeURIComponent(chargeId))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.error) throw new Error(data.error);
          if (data.paid) {
            try { localStorage.setItem("madark-last-purchase", JSON.stringify({ key: "live-" + data.id })); } catch (e) {}
            success("الخدمة");
          } else {
            failure("حالة الدفع: " + (data.status || "غير مكتمل") + ".");
          }
        })
        .catch(function (err) {
          failure(err.message || "تعذر الاتصال بخادم التحقق.");
        });
    })();
  </script>
</body>
</html>
