<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة إعدادات المالك — مدارك للتدريب والتعليم</title>
  <meta name="description" content="لوحة إعدادات مالك منصة مدارك: تعديل الأسعار والخطط وطرق الدفع.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%99%3C/text%3E%3C/svg%3E">
  <style>
    .admin-wrap { min-height: 60vh; display: flex; align-items: flex-start; justify-content: center; padding: 48px 20px 80px; }
    .admin-inner { width: 100%; max-width: 860px; }
    .admin-login-card { max-width: 440px; margin: 0 auto; }
    .admin-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .admin-head h2 { font-size: 26px; margin-bottom: 6px; }
    .admin-head p { color: var(--text-muted); font-size: 15px; }
    .admin-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-bottom: 24px; }
    .admin-panels .panel { min-width: 0; }
    .admin-panels .panel:nth-child(1) { grid-column: 1 / -1; }
    .admin-panels .panel:nth-child(3) { grid-column: 1 / -1; }
    .admin-hint { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .admin-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--border); }
    .admin-row:last-child { border-bottom: none; }
    .admin-key { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .admin-input { width: 110px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-soft); color: var(--text); font-family: inherit; font-size: 14px; }
    .admin-input-sm { width: 76px; }
    .admin-input-xs { width: 80px; }
    .admin-input-md { width: 150px; }
    .admin-color { width: 46px; height: 40px; padding: 2px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-soft); cursor: pointer; }
    .admin-select { width: 230px; }
    .admin-font-select { flex: 1; min-width: 200px; }
    .admin-method-row { flex-wrap: nowrap; }
    .admin-input:focus { outline: none; border-color: var(--primary); }
    .admin-check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; white-space: nowrap; }
    .admin-check input { width: 16px; height: 16px; accent-color: var(--primary); }
    .admin-actions { display: flex; gap: 14px; flex-wrap: wrap; }
    .admin-note { margin-top: 16px; padding: 12px 16px; border-radius: 12px; background: var(--warning-soft, rgba(245,158,11,.12)); color: #b45309; font-size: 13px; font-weight: 700; line-height: 1.7; }
    .admin-panel-title { font-weight: 800; font-size: 15px; margin-bottom: 4px; }
    .admin-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 14px; }
    .admin-stat { border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 14px; text-align: center; }
    .admin-stat b { font-family: var(--font-head); font-size: 26px; display: block; }
    .admin-stat span { font-size: 12.5px; color: var(--text-muted); }
    .admin-stat.a b { color: var(--primary); }
    .admin-stat.b b { color: var(--success); }
    .admin-stat.c b { color: #b45309; }
    .admin-stat.d b { color: var(--info); }
    .admin-teacher-req { border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 10px; }
    @media (max-width: 720px) {
      .admin-panels { grid-template-columns: 1fr; }
      .admin-panels .panel:nth-child(1),
      .admin-panels .panel:nth-child(3) { grid-column: auto; }
      .admin-row { flex-wrap: wrap; }
      .admin-key { flex: 1 0 100%; }
    }
  </style>
</head>
<body>

  <div data-slot="header" data-active=""></div>

  <main class="admin-wrap">
    <div class="admin-inner">

      <!-- ======= شاشة تسجيل الدخول ======= -->
      <section id="adminLogin" class="panel admin-login-card">
        <div class="panel-head" style="display:block;">
          <h3 style="font-size:20px;margin-bottom:6px;">لوحة إعدادات المالك</h3>
          <p style="font-size:14px;color:var(--text-muted);">هذه المنطقة مخصصة لمالك منصة مدارك فقط.</p>
        </div>
        <form id="ownerLoginForm">
          <div class="form-group">
            <label for="ownerEmail">البريد الإلكتروني</label>
            <input type="email" id="ownerEmail" class="admin-input" style="width:100%;" placeholder="admin@madark.edu" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="ownerPass">كلمة المرور</label>
            <input type="password" id="ownerPass" class="admin-input" style="width:100%;" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary btn-lg btn-block">دخول المالك</button>
          <p style="text-align:center;font-size:13px;color:var(--text-muted);margin-top:14px;">
            <a href="index.html" style="color:var(--primary);font-weight:700;">العودة للموقع</a>
          </p>
        </form>
      </section>

      <!-- ======= شاشة الإعدادات (تُبنى ديناميكياً) ======= -->
      <section id="adminDash" style="display:none;"></section>

    </div>
  </main>

  <div data-slot="footer"></div>

  <script src="js/site-config.js"></script>
  <script src="js/components.js"></script>
  <script src="js/payment.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
