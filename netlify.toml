# ============================================
#   إعداد مشترك لكل الموقعين من نفس المستودع
#   (دليل النشر لكل موقع يُضبط من لوحة Netlify)
#   - المنارة:      publish = "manara-site"
#   - Madark:       publish = "madark" + functions = "madark/netlify/functions"
# ============================================

# 404 fallback: keep single-page routes working
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Force HTTPS always on
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
